name: ionization_3d_h
model: SRFlow
distortion: sr
scale: 2
use_tb_logger: true

datasets:
  train:
    name: H3DTrain
    mode: LRHR_3D
    dataroot_GT: D:/Daniel/Ionization-Vis-2008/H
    depth: 200
    height: 248
    width: 248
    phase: train
    scale: 2
    patch_size: 64
    normalize: log1p
    random_flip: true
    random_rot: true
    cache_stats: true
    n_workers: 0
    batch_size: 1

  val:
    name: H3DVal
    mode: LRHR_3D
    dataroot_GT: D:/Daniel/Ionization-Vis-2008/H
    depth: 200
    height: 248
    width: 248
    phase: val
    scale: 2
    patch_size: 64
    normalize: log1p
    random_flip: false
    random_rot: false
    cache_stats: false
    n_workers: 0
    batch_size: 1

network_G:
  which_model_G: SRFlowNet
  in_nc: 1
  out_nc: 1
  nf: 32
  nb: 4
  flow:
    K: 8
    L: 3
    hidden_channels: 32
    coupling: CondAffineSeparatedAndCond
    condAff:
      in_channels_rrdb: 32  # Match nf value
    split:
      enable: true
      type: Split3d
      consume_ratio: 0.5
    fea_up0: true  # Enable fea_up0 for scale=2
    fea_up-1: true  # Enable fea_up-1 for scale=2
  isotropic3d: true

train:
  niter: 1000
  warmup_iter: 0
  manual_seed: 42
  lr_G: 2.0e-4
  weight_decay_G: 0
  beta1: 0.9
  beta2: 0.999
  lr_scheme: MultiStepLR
  lr_steps: [500, 800]
  lr_gamma: 0.5
  weight_fl: 1.0
  weight_l1: 0.01

val:
  heats: [0.0, 0.5]
  n_sample: 1

logger:
  print_freq: 20
  save_checkpoint_freq: 200
  save_latest_freq: 100
  val_freq: 200

path:
  root: .
  experiments_root: experiments/ionization_3d_h
  results_root: results/ionization_3d_h
  log: experiments/ionization_3d_h/log
  pretrain_model_G: ~
