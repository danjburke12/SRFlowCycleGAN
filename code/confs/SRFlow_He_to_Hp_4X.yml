#### general settings
name: He_to_Hp_train
use_tb_logger: true
model: SRFlow
distortion: sr
scale: 1  # No upscaling for volume-to-volume conversion
gpu_ids: [ 0 ]

#### datasets
datasets:
  train:
    name: He_to_Hp_train
    mode: PatchVolume3D
    he_dir: D:\Daniel\Ionization-Vis-2008\He
    hp_dir: D:\Daniel\Ionization-Vis-2008\H+
    indices: [ 0, 1, 2, 3, 4, 5, 6 ]  # Training indices
    depth: 32
    height: 32
    width: 32
    patch_size: 32
    use_shuffle: true
    n_workers: 3  # per GPU
    batch_size: 4
  val:
    name: He_to_Hp_val
    mode: PatchVolume3D
    he_dir: D:\Daniel\Ionization-Vis-2008\He
    hp_dir: D:\Daniel\Ionization-Vis-2008\H+
    indices: [ 7, 8 ]  # Validation indices
    depth: 32
    height: 32
    width: 32
    patch_size: 32

#### network structures
network_G:
  which_model_G: SRFlowNet
  in_nc: 1  # Single channel for volumetric data
  out_nc: 1  # Single channel output
  nf: 64
  nb: 23
  upscale: 1  # No upscaling for volume-to-volume conversion
  train_RRDB: true  # Train RRDB from scratch instead of using pretrained
  train_RRDB_delay: 0.0  # Start training RRDB immediately
  use_iso3d: true  # Enable 3D convolutions

  flow:
    K: 16
    L: 3
    noInitialInj: true
    coupling: CondAffineSeparatedAndCond
    additionalFlowNoAffine: 2
    split:
      enable: true
    fea_up0: true
    stackRRDB:
      blocks: [ 1, 8, 15, 22 ]
      concat: true

#### path
path:
  strict_load: true
  resume_state: ~  # No resume for fresh training

#### training settings: learning rate scheme, loss
train:
  manual_seed: 10
  lr_G: !!float 2.5e-4
  weight_decay_G: 0
  beta1: 0.9
  beta2: 0.99
  lr_scheme: MultiStepLR
  warmup_iter: -1  # no warm up
  lr_steps_rel: [ 0.5, 0.75, 0.9, 0.95 ]
  lr_gamma: 0.5

  niter: 200000
  val_freq: 40000

#### validation settings
val:
  heats: [ 0.0, 0.5, 0.75, 1.0 ]
  n_sample: 3

#### logger
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 1e3
