network_G:
  isotropic3d: true
  which_model_G: SRFlowNet
  in_nc: 1
  out_nc: 1
  nf: 64
  nb: 8
  upscale: 1
  train_RRDB: false
  train_RRDB_delay: 0.5
  flow:
    K: 16
    L: 4
    coupling: CondAffineSeparatedAndCond
    split:
      enable: true
    fea_up0: true
    stackRRDB:
      blocks: 
        - 1
        - 3
        - 5
        - 7
      concat: true

path:
  pretrain_model_G: null
  strict_load: true
  resume_state: auto

train:
  manual_seed: 10
  lr_G: 0.0005
  weight_decay_G: 0
  beta1: 0.9
  beta2: 0.99
  lr_scheme: MultiStepLR
  warmup_iter: -1
  lr_steps_rel:
    - 0.5
    - 0.75
    - 0.9
    - 0.95
  lr_gamma: 0.5
  niter: 10000
  val_freq: 1000

val:
  heats:
    - 0.0
    - 0.5
    - 0.75
    - 1.0
  n_sample: 3

logger:
  print_freq: 100
  save_checkpoint_freq: 1000
